name: nextgen_backend
services:
  mongodb:
    image: mongo:7.0
    container_name: nextgen_backend_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=nextgen_test_portal

  redis:
    image: redis:7-alpine
    container_name: nextgen_backend_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nextgen_backend_standalone
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOSTNAME=0.0.0.0
      - MONGODB_URI=mongodb://mongodb:27017/nextgen_test_portal
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super-secret-key-change-in-production-123456
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      - NODE_ENV=development
    depends_on:
      - mongodb
      - redis

volumes:
  mongo_data:
  redis_data:
