name: nextgen_test_portal

services:
  # 1. MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: nextgen-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=nextgen_test_portal
    networks:
      - nextgen-network

  # 2. Redis Cache & Telemetry Broker
  redis:
    image: redis:7-alpine
    container_name: nextgen-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
      - nextgen-network

  # 3. Node.js Express & Socket.IO Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nextgen-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOSTNAME=0.0.0.0
      - MONGODB_URI=mongodb://mongodb:27017/nextgen_test_portal
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super-secret-key-change-in-production-123456
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      - NODE_ENV=production
    depends_on:
      - mongodb
      - redis
    networks:
      - nextgen-network

  # 4. Admin Dashboard (Next.js)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: nextgen-admin
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:8000
    depends_on:
      - backend
    networks:
      - nextgen-network

  # 5. Candidate Assessment Portal (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nextgen-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/nextgen_test_portal
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super-secret-key-change-in-production-123456
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
      - NEXT_PUBLIC_SOCKET_URL=http://localhost:8000
    depends_on:
      - mongodb
      - redis
      - backend
    networks:
      - nextgen-network

networks:
  nextgen-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
